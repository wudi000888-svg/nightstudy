name: Exercise ordinary-user recognition across all built-in books

on:
  workflow_call:

permissions:
  contents: read

jobs:
  recognition:
    if: github.repository == 'wudi000888-svg/nightstudy'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: nightstudy-recognition-ci-${{ github.run_id }}
      NIGHTSTUDY_IMAGE: nightstudy:recognition-ci
      DATABASE_URL: ''
      POSTGRES_DB: recognition_ci
      POSTGRES_PASSWORD: ci-only-recognition-not-a-production-key
      BETTER_AUTH_SECRET: ci-only-recognition-auth-secret-at-least-thirty-two
      BOOTSTRAP_TOKEN: ci-only-recognition-bootstrap-not-a-production-token
      PUBLIC_URL: http://127.0.0.1:5198
      NODE_ENV: production
      CONTENT_PACK: ecdict
      AUDIO_PACK: none
      ADMIN_BOOTSTRAP: auto
      REGISTRATION_OPEN: 'true'
      NIGHTSTUDY_DISPOSABLE_COMPOSE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - name: Check isolated acceptance guard boundaries
        run: node --test scripts/check-all-book-recognition-http.test.mjs
      - name: Build the actual application
        run: docker build --tag nightstudy:recognition-ci .
      - name: Install complete text in a disposable realm without sound generation
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config --quiet
          docker compose up --detach --no-build --wait --wait-timeout 1800 app
          curl --fail --silent http://127.0.0.1:5198/health/ready
          docker compose exec -T app node scripts/check-learning-senses-install.mjs --single-site default
      - name: Exercise eighteen independent ordinary learners without scoring
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/nightstudy-content-acceptance"
          node scripts/check-all-book-recognition-http.mjs --base-url http://127.0.0.1:5198 \
            --receipt "$RUNNER_TEMP/nightstudy-content-acceptance/recognition.json"
      - name: Retain content-only recognition evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: all-book-recognition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightstudy-content-acceptance
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop only this disposable Compose project
        if: always()
        run: |
          if [ -f .env ]; then docker compose down --volumes --remove-orphans; fi
