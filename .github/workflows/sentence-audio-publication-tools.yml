name: Check independent publication tools without models

on:
  workflow_call:
    inputs:
      image_smoke:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'wudi000888-svg/nightstudy'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Format new acceptance sources and descriptors
        id: format
        run: |
          set -euo pipefail
          npm exec --yes --package=prettier@3.9.10 -- prettier --write \
            scripts/check-ci-sentence-audio-selected-installer.mjs \
            scripts/check-ci-sentence-audio-selected-installer.test.mjs \
            scripts/check-all-book-content-http.mjs scripts/check-all-book-content-h5.mjs \
            scripts/check-all-book-recognition-http.mjs scripts/check-all-book-recognition-http.test.mjs \
            scripts/audio-prepare.ts scripts/audio-prepare-cache.test.ts scripts/audio-prepare-profile.test.ts compose.yaml \
            apps/api/src/modules/content.ts apps/api/src/audio.integration.test.ts \
            .github/workflows/ci.yml .github/workflows/all-book-recognition.yml .github/workflows/release.yml \
            .github/workflows/sentence-audio-publication.yml .github/workflows/sentence-audio-publication-tools.yml \
            docs/ALL_BOOK_SENSES_AUDIO_013.md README.md CHANGELOG.md docs/DEPLOYMENT.md
          node --check scripts/check-all-book-content-http.mjs
          node --check scripts/check-all-book-content-h5.mjs
      - name: Verify the original and selected installer boundaries
        id: tests
        run: |
          set -euo pipefail
          node --test scripts/check-ci-sentence-audio-installer.test.mjs \
            scripts/check-ci-sentence-audio-selected-installer.test.mjs \
            scripts/check-all-book-recognition-http.test.mjs
          python3 scripts/select-ci-sentence-audio-publication.test.py
          python3 scripts/run-ci-sentence-audio-publication.test.py
          python3 -m py_compile scripts/run-ci-sentence-audio-publication.py
          pnpm exec vitest run scripts/audio-prepare-cache.test.ts scripts/audio-prepare-profile.test.ts
          bash -n scripts/install.sh
      - name: Smoke the exact release pull gate against the immutable public 0.12 image
        id: image_smoke
        if: inputs.image_smoke
        env:
          IMAGE_NAME: ghcr.io/wudi000888-svg/nightstudy
          IMAGE_DIGEST: sha256:884c62d81a69f243f370fa30c3b563ffe6dc4eee776cc9848a2e33380d5b43b5
          RELEASE_TAG: v0.12.0-alpha.1
          SOURCE_REVISION: b8cde5bb8283da2f2f0b20daffd86515b9d2270f
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const source = fs.readFileSync('.github/workflows/release.yml', 'utf8');
          const lines = source.split('\n');
          const marker = '      - name: Verify anonymous access to the immutable Linux amd64 release image';
          if (lines.filter(line => line === marker).length !== 1) throw new Error('exact_release_gate_required');
          const start = lines.indexOf(marker);
          const run = lines.findIndex((line, index) => index > start && line === '        run: |');
          if (run < 0 || run - start > 10) throw new Error('bounded_release_run_block');
          const body = [];
          for (const line of lines.slice(run + 1)) {
            if (line && !line.startsWith('          ')) break;
            body.push(line.slice(10));
          }
          if (body.length < 20 || body.length > 100 || !body.some(line => line.includes('env -u GH_TOKEN -u GITHUB_TOKEN -u DOCKER_AUTH_CONFIG'))) throw new Error('complete_anonymous_gate_required');
          const script = body.join('\n') + '\n';
          const sha = value => crypto.createHash('sha256').update(value).digest('hex');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'nightstudy-release-smoke.sh'), script, { flag: 'wx', mode: 0o700 });
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'nightstudy-release-smoke-source.json'), JSON.stringify({
            kind: 'nightstudy-existing-image-gate-smoke-source-v1',
            workflowSourceSha256: sha(source), extractedBashSha256: sha(script),
            executingRevision: process.env.GITHUB_SHA,
            subjectImage: process.env.IMAGE_NAME + '@' + process.env.IMAGE_DIGEST,
            subjectVersion: process.env.RELEASE_TAG, subjectRevision: process.env.SOURCE_REVISION,
            new013ImageAcceptance: false, modelUsed: false, applicationStarted: false,
          }, null, 2) + '\n', { flag: 'wx', mode: 0o600 });
          NODE
          bash -n "$RUNNER_TEMP/nightstudy-release-smoke.sh"
          bash "$RUNNER_TEMP/nightstudy-release-smoke.sh"
      - name: Retain the old-image smoke evidence without claiming a new release
        if: always() && inputs.image_smoke
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: existing-image-gate-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.image_smoke.outputs.receipt }}
            ${{ runner.temp }}/nightstudy-release-smoke-source.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve exact sources and outcome
        if: always() && steps.format.outcome == 'success'
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          IMAGE_SMOKE_OUTCOME: ${{ steps.image_smoke.outcome }}
        run: |
          set -euo pipefail
          stem="ci-publication-tools-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tar -czf "$RUNNER_TEMP/$stem.sources.tar.gz" \
            scripts/run-ci-sentence-audio-publication.py scripts/run-ci-sentence-audio-publication.test.py \
            scripts/check-ci-sentence-audio-selected-installer.mjs \
            scripts/check-ci-sentence-audio-selected-installer.test.mjs \
            scripts/check-all-book-content-http.mjs scripts/check-all-book-content-h5.mjs \
            scripts/check-all-book-recognition-http.mjs scripts/check-all-book-recognition-http.test.mjs \
            scripts/audio-prepare.ts scripts/audio-prepare-cache.test.ts scripts/audio-prepare-profile.test.ts compose.yaml \
            apps/api/src/modules/content.ts apps/api/src/audio.integration.test.ts \
            .github/workflows/ci.yml .github/workflows/all-book-recognition.yml .github/workflows/release.yml \
            .github/workflows/sentence-audio-publication.yml .github/workflows/sentence-audio-publication-tools.yml \
            docs/ALL_BOOK_SENSES_AUDIO_013.md README.md CHANGELOG.md docs/DEPLOYMENT.md
          jq -n --arg outcome "$TEST_OUTCOME" --arg source "$GITHUB_SHA" --arg imageSmokeOutcome "$IMAGE_SMOKE_OUTCOME" \
            '{kind:"nightstudy-publication-tools-test-v1",outcome:$outcome,source:$source,imageSmokeOutcome:$imageSmokeOutcome,modelUsed:false,fullInstallerExecuted:false,fullApplicationAcceptancePassed:false}' \
            > "$RUNNER_TEMP/$stem.check.json"
          gh release upload audio-build-batches-014-20261019 --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/$stem.sources.tar.gz" "$RUNNER_TEMP/$stem.check.json"
