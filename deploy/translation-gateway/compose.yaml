# Standalone VPS: no application database or authentication secrets are needed.
name: nightstudy-translation
services:
  gateway:
    image: ${NIGHTSTUDY_IMAGE:-nightstudy-translation:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    command: [node, apps/api/dist/translation-gateway-server.js]
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '3099'
      TRANSLATION_GATEWAY_SECRET: ${TRANSLATION_GATEWAY_SECRET:?Generate a private gateway secret}
      TRANSLATION_REQUESTS_PER_MINUTE: ${TRANSLATION_REQUESTS_PER_MINUTE:-120}
    ports: ['127.0.0.1:${GATEWAY_HTTP_PORT:-3099}:3099']
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "const r=await fetch('http://127.0.0.1:3099/health/ready',{signal:AbortSignal.timeout(3000)});process.exit(r.ok?0:1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
