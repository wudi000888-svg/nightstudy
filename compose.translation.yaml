# Optional local/same-VPS gateway. Load after compose.yaml.
services:
  app:
    environment:
      TRANSLATION_MODE: gateway
      TRANSLATION_GATEWAY_URL: http://translation-gateway:3099/translate
      TRANSLATION_GATEWAY_SECRET: ${TRANSLATION_GATEWAY_SECRET:?Generate a private gateway secret}
    depends_on:
      translation-gateway:
        condition: service_healthy
  translation-gateway:
    image: ${NIGHTSTUDY_IMAGE:-nightstudy:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: [node, apps/api/dist/translation-gateway-server.js]
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '3099'
      TRANSLATION_GATEWAY_SECRET: ${TRANSLATION_GATEWAY_SECRET:?Generate a private gateway secret}
      TRANSLATION_REQUESTS_PER_MINUTE: ${TRANSLATION_REQUESTS_PER_MINUTE:-120}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
    networks: [backend]
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "const r=await fetch('http://127.0.0.1:3099/health/ready',{signal:AbortSignal.timeout(3000)});process.exit(r.ok?0:1)",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
