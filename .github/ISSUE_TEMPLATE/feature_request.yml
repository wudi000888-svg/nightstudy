name: Feature request / 功能建议
description: 说明用户需求、使用情境与验收条件。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体用户和操作情境。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议行为
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 怎样确认这个功能确实解决了问题？
  - type: textarea
    id: alternatives
    attributes:
      label: 相关方案或限制
