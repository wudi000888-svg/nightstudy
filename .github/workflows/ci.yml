name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      audio_mode:
        description: Application checks, existing-model pilot, complete plan, or first bounded audio batch
        type: choice
        options:
          - verify
          - pilot
          - batch-plan
          - batch-first
          - batch-rest
          - legacy-audit
          - installer-audit
          - legacy-reuse
          - publication-tools
          - publication-first
          - publication-all
        default: verify
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.audio_mode || 'verify' }}
  cancel-in-progress: true

jobs:
  sentence-audio:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'pilot' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-build.yml

  sentence-audio-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'batch-plan' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-batches.yml

  sentence-audio-first:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'batch-first' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-generate.yml

  sentence-audio-remaining:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'batch-rest' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-generate.yml
    with:
      scope: remaining

  sentence-audio-legacy-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'legacy-audit' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-legacy-audit.yml

  sentence-audio-installer-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'installer-audit' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-installer-audit.yml

  sentence-audio-legacy-reuse:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'legacy-reuse' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-legacy-reuse.yml

  sentence-audio-publication-tools:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'publication-tools' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-publication-tools.yml

  sentence-audio-publication-first:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'publication-first' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-publication.yml
    with:
      scope: first

  sentence-audio-publication-all:
    if: github.event_name == 'workflow_dispatch' && inputs.audio_mode == 'publication-all' && github.repository == 'wudi000888-svg/nightstudy'
    permissions:
      contents: write
    uses: ./.github/workflows/sentence-audio-publication.yml
    with:
      scope: all

  verify:
    if: github.event_name != 'workflow_dispatch' || inputs.audio_mode == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nightstudy
          POSTGRES_PASSWORD: ci-only-do-not-use
          POSTGRES_DB: nightstudy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightstudy -d nightstudy_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://nightstudy:ci-only-do-not-use@127.0.0.1:5432/nightstudy_test
      TEST_DATABASE_URL: postgresql://nightstudy:ci-only-do-not-use@127.0.0.1:5432/nightstudy_test
      CONTENT_TEST_DATABASE_URL: postgresql://nightstudy:ci-only-do-not-use@127.0.0.1:5432/nightstudy_test
      TEST_DATABASE_URL_B: postgresql://nightstudy:ci-only-do-not-use@127.0.0.1:5432/nightstudy_b_test
      POSTGRES_DB: nightstudy_test
      POSTGRES_PASSWORD: ci-only-do-not-use
      BETTER_AUTH_SECRET: ci-only-auth-secret-not-a-production-key-2026
      BOOTSTRAP_TOKEN: ci-only-bootstrap-not-a-production-token-2026
      PUBLIC_URL: http://127.0.0.1:3000
      REGISTRATION_OPEN: 'true'
      NODE_ENV: test
      CONTENT_PACK: demo
      AUDIO_PACK: none
      ADMIN_BOOTSTRAP: manual
      TRANSLATION_GATEWAY_SECRET: ci-only-gateway-token-not-a-production-secret-2026
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm db:prepare
      - name: Prepare independent second test realm
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_SERVICE_ID" psql -U nightstudy -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nightstudy_b_test;'
          DATABASE_URL="$TEST_DATABASE_URL_B" pnpm db:prepare
      - run: pnpm sites:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Verify bounded audio archive extraction
        run: |
          python3 scripts/audio-extract.test.py
          python3 scripts/audio-offline.test.py
      - name: Verify offline bilingual provenance and output boundaries
        run: |
          python3 scripts/bilingual-llm.test.py
          python3 scripts/bilingual-compile.test.py
          python3 scripts/bilingual-apply-corrections.test.py
          python3 scripts/bilingual-assemble.test.py
          python3 scripts/bilingual-author-compile.test.py
          python3 scripts/tatoeba-direct-source.test.py
          python3 scripts/manythings-source.test.py
          python3 scripts/phrase-compile.test.py
          python3 scripts/learning-senses-compile.test.py
          python3 scripts/learning-senses-audio.test.py
          python3 scripts/sentence-pronunciation.test.py
          python3 scripts/sentence-audio-holds.test.py
          python3 scripts/audio-journal.test.py
          python3 scripts/learning-senses-targets.test.py
          python3 scripts/recognition-confusables.test.py
          node scripts/check-sentence-audio-policy.mjs --self-test
          node scripts/check-audio-install.mjs --self-test
          node scripts/check-learning-senses-install.mjs --self-test
      - name: Validate Compose descriptors
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.scale.yaml config --quiet
          docker compose -f compose.yaml -f compose.translation.yaml config --quiet
          docker compose -f deploy/translation-gateway/compose.yaml config --quiet
      - name: Build alpha container
        run: docker build --tag nightstudy:ci .
      - name: Smoke-test isolated Compose installation
        env:
          COMPOSE_PROJECT_NAME: nightstudy-ci-${{ github.run_id }}
          NIGHTSTUDY_IMAGE: nightstudy:ci
          DATABASE_URL: ''
          PUBLIC_URL: http://127.0.0.1:5198
          NODE_ENV: production
          CONTENT_PACK: ecdict
          AUDIO_PACK: standard
          ADMIN_BOOTSTRAP: auto
        run: |
          # Capture the pristine canonical catalog before the default initializer
          # installs bilingual fields. The snapshot contains only IDs and hashes.
          docker compose up --detach --no-build --wait --wait-timeout 120 postgres
          docker compose run --rm --no-deps --entrypoint /bin/sh init -ec '
            pnpm generate
            pnpm db:deploy
            pnpm db:seed
            pnpm db:bootstrap
            pnpm content:prepare
            pnpm phonetics:prepare
            pnpm audio:prepare
            node scripts/check-audio-install.mjs --snapshot /app/.local/content/bilingual-before.json
          '
          docker compose up --detach --no-build --wait --wait-timeout 600 app
          curl --fail --silent http://127.0.0.1:5198/health/ready
          curl --fail --silent http://127.0.0.1:5198/api/v2/dictionary/stats > /tmp/nightstudy-catalog.json
          node --input-type=module -e "import fs from 'node:fs';const j=JSON.parse(fs.readFileSync('/tmp/nightstudy-catalog.json','utf8'));if(!j.installedDictionary||j.declaredEntryCount!==770611)process.exit(1)"
          docker compose exec -T app node scripts/check-learning-senses-install.mjs --single-site default
          docker compose exec -T app node scripts/check-audio-install.mjs --bilingual-baseline /app/.local/content/bilingual-before.json
          docker compose exec -T app node scripts/check-learning-senses-install.mjs --single-site default --audio
          umask 077
          docker compose run --rm --no-deps --entrypoint node init scripts/export-admin-credentials.mjs > /tmp/nightstudy-ci-admin.json
          node --input-type=module -e "import fs from 'node:fs';const j=JSON.parse(fs.readFileSync('/tmp/nightstudy-ci-admin.json','utf8'));const c=j.credentials[0];if(j.credentials.length!==1||c.username!=='admin'||c.password.length<32)process.exit(1);const r=await fetch('http://127.0.0.1:5198/api/auth/sign-in/username',{method:'POST',headers:{'Content-Type':'application/json',Origin:'http://127.0.0.1:5198'},body:JSON.stringify({username:c.username,password:c.password})});if(r.status!==200)process.exit(1)"
          rm -f /tmp/nightstudy-ci-admin.json
      - name: Smoke-test closed translation gateway container
        env:
          COMPOSE_PROJECT_NAME: nightstudy-ci-${{ github.run_id }}
          NIGHTSTUDY_IMAGE: nightstudy:ci
          DATABASE_URL: ''
          PUBLIC_URL: http://127.0.0.1:5198
        run: |
          docker compose -f compose.yaml -f compose.translation.yaml up --detach --no-build --wait translation-gateway
          docker compose -f compose.yaml -f compose.translation.yaml exec -T translation-gateway node --input-type=module -e "const r=await fetch('http://127.0.0.1:3099/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'rain'})});if(r.status!==401)process.exit(1)"
      - name: Stop isolated Compose installation
        if: always()
        env:
          COMPOSE_PROJECT_NAME: nightstudy-ci-${{ github.run_id }}
          DATABASE_URL: ''
          PUBLIC_URL: http://127.0.0.1:5198
        run: |
          if [ -f .env ]; then
            docker compose -f compose.yaml -f compose.translation.yaml down --volumes --remove-orphans
          fi
